<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="面積魔術師：平行四邊形" />
  <title>面積魔術師：平行四邊形</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink: #ff7eb6; --pink-deep: #ee4d93;
      --sky: #5cc8ff; --sky-deep: #2a9adf;
      --lemon: #ffe066; --lemon-deep: #e4b82a;
      --lilac: #c9b6ff; --lilac-deep: #9b7af0;
      --mint: #7eecc8; --mint-deep: #3cbc9a;
      --ink: #3b2a55; --soft: #7a6588;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden; overscroll-behavior: none;
    }
    body {
      position: fixed; inset: 0;
      font-family: "Noto Sans TC", "PingFang HK", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(176, 245, 220, 0.72) 0%, rgba(176, 245, 220, 0) 36%),
        linear-gradient(128deg, rgba(255, 214, 234, 0.58) 0%, rgba(255, 214, 234, 0) 44%),
        linear-gradient(214deg, rgba(255, 244, 176, 0.58) 18%, rgba(255, 244, 176, 0) 56%),
        linear-gradient(158deg, #d4fff3 0%, #e7fbff 38%, #ffeaf3 72%, #fff7d2 100%);
      user-select: none;
    }
    .fun-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .deco { position: absolute; }
    .deco svg { width: 100%; height: auto; aspect-ratio: 24 / 14; display: block; overflow: visible; }
    .deco-lt { top: 4%; left: 11%; width: 34vmin; height: 22vmin; transform: rotate(-26deg); }
    .deco-lbl { top: 36%; left: 1%; width: 29vmin; height: 19vmin; transform: rotate(17deg); }
    .deco-lbr { top: 68%; left: 16%; width: 32vmin; height: 21vmin; transform: rotate(-9deg); }
    .deco-rt { top: 6%; right: 3%; width: 33vmin; height: 21vmin; transform: rotate(11deg); }
    .deco-rbl { top: 38%; right: 14%; width: 28vmin; height: 18vmin; transform: rotate(-21deg); }
    .deco-rbr { top: 70%; right: 5%; width: 31vmin; height: 20vmin; transform: rotate(15deg); }
    button, input { font-family: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    input { user-select: text; -webkit-user-select: text; }

    @keyframes popIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
    @keyframes bounce { 0% { transform: scale(1); } 35% { transform: scale(0.88); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 224, 102, 0)); }
      50% { filter: drop-shadow(0 0 10px rgba(255, 224, 102, 0.85)); }
    }
    .bounce { animation: bounce 0.35s ease; }
    .shake { animation: shake 0.4s ease; }

    .app {
      position: relative; z-index: 1;
      height: 100%; width: 100%; overflow: hidden; display: flex;
      padding: calc(6px + var(--safe-t)) calc(8px + var(--safe-r)) calc(6px + var(--safe-b)) calc(8px + var(--safe-l));
    }
    .screen {
      display: none; width: min(1280px, 100%); margin: 0 auto;
      height: 100%; min-height: 0; flex-direction: column; overflow: hidden;
      animation: popIn 0.35s ease;
    }
    .screen.active { display: flex; }
    .card {
      background: rgba(255,255,255,0.92); border: 3px solid #fff; border-radius: 26px;
      box-shadow: 0 14px 30px rgba(155, 122, 240, 0.18); min-height: 0; color: var(--ink);
    }
    .candy {
      border: 0; border-radius: 999px; font-weight: 900; padding: 10px 18px;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .candy:hover { filter: brightness(1.05); }
    .candy:active { transform: translateY(4px) scale(0.96); box-shadow: 0 2px 0 rgba(0,0,0,0.18) !important; animation: bounce 0.3s ease; }
    .candy:disabled { filter: saturate(0.55); pointer-events: none; }
    .sky { background: var(--sky); color: #0a3a5c; box-shadow: 0 6px 0 var(--sky-deep); }
    .pink { background: var(--pink); color: #fff; box-shadow: 0 6px 0 var(--pink-deep); }
    .lemon { background: var(--lemon); color: var(--ink); box-shadow: 0 6px 0 var(--lemon-deep); }
    .mint { background: var(--mint); color: #165f4c; box-shadow: 0 6px 0 var(--mint-deep); }
    .lilac { background: var(--lilac); color: #fff; box-shadow: 0 6px 0 var(--lilac-deep); }
    .ghost { background: #fff; color: var(--soft); box-shadow: 0 5px 0 #ecd6de; }

    #screen-login { align-items: center; justify-content: center; }
    .login { width: min(400px, 100%); padding: 22px 18px 16px; text-align: center; }
    .mascot {
      width: 72px; height: 72px; margin: 0 auto 6px; border-radius: 50%;
      display: grid; place-items: center; font-size: 36px; background: #fff;
      box-shadow: 0 8px 0 #ffc2e0;
      animation: floaty 2.8s ease-in-out infinite;
    }
    .title {
      font-family: "Fredoka", "Noto Sans TC", sans-serif;
      font-size: clamp(22px, 5vh, 34px); font-weight: 900; letter-spacing: 0.04em;
      margin-bottom: 14px; line-height: 1.3;
      background: none; border: 0; box-shadow: none; padding: 0; text-shadow: none;
    }
    .title span:nth-child(odd) { color: var(--pink-deep); }
    .title span:nth-child(even) { color: var(--lilac-deep); }
    .field { text-align: left; margin-bottom: 10px; }
    .field label { display: block; font-weight: 900; font-size: 15px; margin-bottom: 4px; }
    .field input {
      width: 100%; border: 3px solid #ffe1ec; border-radius: 16px;
      padding: 10px 12px; font-size: 18px; font-weight: 800; outline: none; background: #fff;
    }
    .field input:focus { border-color: var(--pink); }
    .start { width: 100%; font-size: 22px; padding: 12px; margin: 6px 0 10px; }
    .teacher-btn {
      width: 64px; height: 64px; border-radius: 50%; font-size: 13px; line-height: 1.15;
      padding: 0; margin: 4px auto 0; display: grid; place-items: center;
    }
    .login-acts {
      display: flex; flex-wrap: nowrap; justify-content: center; align-items: center;
      gap: 22px; margin-top: 4px;
    }
    .login-acts .teacher-btn {
      margin: 0; padding: 0; width: 64px; height: 64px; min-width: 64px;
      flex: 0 0 64px; font-size: 13px; line-height: 1.2;
    }
    .rank-note {
      flex-shrink: 0; font-family: "Fredoka", "Noto Sans TC", sans-serif;
      font-weight: 900; font-size: clamp(24px, 3.6vh, 32px); line-height: 1.3;
      color: var(--pink-deep); text-align: center; letter-spacing: 0.04em;
    }
    tr.r1 td { background: #fff6c9; }
    tr.r2 td { background: #eef2f7; }
    tr.r3 td { background: #f8ead8; }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; margin-bottom: 4px; overflow: visible; }
    .pill {
      background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 12px;
      font-weight: 800; font-size: 14px; box-shadow: 0 4px 0 #f0d7e2; white-space: nowrap;
    }
    .timer-wrap { position: relative; flex-shrink: 0; }
    .timer { font-variant-numeric: tabular-nums; background: #fff4cc; min-width: 92px; text-align: center; }
    .timer.low, .timer.hit { background: #ffd0d8; color: #b42318; }
    .timer.hit { animation: shake 0.4s ease; }
    .time-hit {
      position: absolute; left: 50%; top: 50%; z-index: 3;
      font-weight: 900; font-size: 16px; color: #b42318;
      pointer-events: none; opacity: 0; white-space: nowrap;
      text-shadow: 0 1px 0 #fff, 0 0 8px #fff;
    }
    .time-hit.show { animation: timeHitPop 0.7s ease; }
    @keyframes timeHitPop {
      0% { opacity: 0; transform: translate(-50%, -40%) scale(0.8); }
      22% { opacity: 1; transform: translate(-50%, -110%) scale(1.12); }
      100% { opacity: 0; transform: translate(-50%, -160%) scale(0.96); }
    }
    .tiny { padding: 6px 12px; font-size: 13px; }

    .play { flex: 1; min-height: 0; overflow: hidden; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
    .task-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-shrink: 0; }
    .task-h h2 { font-size: clamp(18px, 2.6vh, 24px); line-height: 1.3; }
    .task-h p { font-size: 16px; font-weight: 900; color: var(--soft); white-space: nowrap; }
    .hintbar {
      flex-shrink: 0; font-size: clamp(18px, 2.8vh, 24px); font-weight: 800; color: #5a4a72;
      background: #f4edff; border-radius: 14px; padding: 8px 12px; text-align: center;
      line-height: 1.35;
    }
    .board {
      flex: 1; min-height: 0; position: relative;
      display: flex; align-items: stretch; justify-content: center;
      background: linear-gradient(180deg, #fff, #f7f4ff);
      border-radius: 22px; overflow: hidden;
      box-shadow: inset 0 0 0 2px rgba(201, 182, 255, 0.4);
      touch-action: none;
    }
    .board::before, .board::after {
      content: ""; position: absolute; width: 36px; height: 12px; z-index: 2; pointer-events: none;
      background: rgba(255, 224, 102, 0.88); border-radius: 2px;
      box-shadow: 0 2px 0 rgba(228, 184, 42, 0.35);
    }
    .board::before { top: 10px; left: 14px; transform: rotate(-18deg); }
    .board::after { top: 12px; right: 16px; transform: rotate(16deg); }
    #scene { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
    #scene.dragging { cursor: grabbing; }

    .idea {
      display: none; position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 6;
      background: rgba(255,255,255,0.97); border: 3px solid #ffe066; border-radius: 18px;
      padding: 10px 12px 12px; text-align: center;
      box-shadow: 0 12px 28px rgba(155, 122, 240, 0.22);
      animation: popIn 0.35s ease;
    }
    .idea.show { display: block; }
    .idea p {
      font-weight: 800; font-size: clamp(12px, 1.85vh, 16px); line-height: 1.4;
      margin-bottom: 8px; text-align: left;
    }
    .idea .candy { min-width: 140px; }

    .choice-row { display: flex; gap: 8px; flex-shrink: 0; align-items: stretch; }
    .choice-row .candy {
      flex: 1; font-size: clamp(16px, 2.5vh, 20px); padding: 12px 8px;
      display: inline-flex; align-items: center; justify-content: center;
      text-align: center; line-height: 1.2;
    }
    .opt-col { display: none; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .opt-col.show { display: flex; }
    .opt-col .candy { width: 100%; text-align: center; font-size: clamp(17px, 2.6vh, 22px); padding: 12px 8px; }
    .toast {
      display: none; flex-shrink: 0; border-radius: 16px; padding: 8px 14px;
      font-weight: 900; font-size: clamp(16px, 2.4vh, 20px); text-align: center; line-height: 1.35;
    }
    .toast.show { display: block; }
    .toast.good { background: #e4faf2; border: 2px solid #7eecc8; color: #165f4c; }
    .toast.bad { background: #fff1f1; border: 2px solid #ffb4b4; color: #b42318; }

    .report {
      position: fixed; inset: 0; background: rgba(59, 42, 85, 0.42);
      display: none; place-items: center; z-index: 25; padding: 16px;
    }
    .report.show { display: grid; }
    .report-card {
      width: min(520px, 100%); background: #fff; border-radius: 32px;
      padding: 22px 20px 18px; text-align: center; border: 4px solid #fff;
      box-shadow: 0 18px 40px rgba(255, 126, 182, 0.28); animation: popIn 0.4s ease; color: var(--ink);
    }
    .report-card h2 { font-size: clamp(22px, 3.4vh, 28px); margin: 8px 0 10px; }
    .report-card p { font-weight: 800; line-height: 1.55; margin: 8px 0; font-size: 16px; }
    .tip {
      background: #f4edff; border-radius: 18px; padding: 12px 14px; margin: 12px 0 16px;
      font-weight: 800; line-height: 1.6; text-align: left; white-space: pre-wrap;
    }

    .dash-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-shrink: 0; margin-bottom: 8px; }
    .dash-h h1 { font-family: "Fredoka", "Noto Sans TC", sans-serif; font-size: clamp(20px, 3vh, 28px); color: var(--ink); }
    .dash-h .acts { display: flex; gap: 8px; margin: 0; }
    .dash { flex: 1; min-height: 0; overflow: hidden; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex-shrink: 0; }
    .stat { border-radius: 16px; padding: 10px; }
    .stat b { display: block; font-size: 12px; opacity: 0.8; }
    .stat strong { font-size: clamp(16px, 2.6vh, 24px); display: block; line-height: 1.2; }
    .s1 { background: #ffe1ea; } .s2 { background: #d9f8ee; } .s3 { background: #efe6ff; }
    .tools { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; gap: 8px; flex-wrap: wrap; }
    .tools select, .tools button.tiny { border: 2px solid #ffe1ec; border-radius: 12px; padding: 4px 8px; font-weight: 800; background: #fff; }
    .tool-filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .dash-src { font-size: 12px; font-weight: 800; color: var(--soft); }
    .dash-count { font-size: 12px; font-weight: 800; color: var(--soft); }
    .records { flex: 1; min-height: 0; overflow: auto; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(16,36,63,0.08); font-size: 12px; }
    td.diag { white-space: pre-line; }
    th { background: #fff3f8; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
    th.col-h { padding-right: 4px; }
    .col-sort { border: 0; background: transparent; font: inherit; font-weight: 900; cursor: pointer; padding: 0; }
    th.sorted .col-sort { color: #ee4d93; }
    .filter-btn {
      border: 0; background: #ffe1ec; color: var(--ink); cursor: pointer;
      border-radius: 8px; width: 22px; height: 22px; margin-left: 4px;
      font-size: 12px; font-weight: 900; line-height: 1; vertical-align: middle;
    }
    .filter-btn.on { background: var(--pink); color: #fff; }
    .score-cell { font-variant-numeric: tabular-nums; font-weight: 900; text-align: center; }
    th.score-h, td.rank-cell { text-align: center; font-variant-numeric: tabular-nums; }
    tr.hi .score-cell { color: #1a8f7c; }
    tr.lo .score-cell { color: #b42318; }
    .empty { text-align: center; padding: 20px; font-weight: 800; color: var(--soft); }
    .filter-menu {
      position: fixed; z-index: 30; width: min(280px, calc(100vw - 16px));
      background: #fff; border-radius: 18px; padding: 10px;
      box-shadow: 0 16px 36px rgba(59,42,85,0.24); border: 2px solid #ffe1ec;
      display: none; flex-direction: column; gap: 8px; max-height: min(420px, 70vh);
    }
    .filter-menu.show { display: flex; }
    .filter-menu .fm-title { font-weight: 900; font-size: 14px; text-align: left; }
    .filter-menu .fm-acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-menu .fm-acts button {
      border: 0; border-radius: 999px; font-weight: 900; padding: 6px 10px; font-size: 12px;
      background: #f6f0ff; color: var(--ink); cursor: pointer;
    }
    .filter-menu input[type="search"] {
      width: 100%; border: 2px solid #ffe1ec; border-radius: 12px;
      padding: 6px 8px; font-weight: 800; font-size: 14px;
    }
    .filter-menu .opts { overflow: auto; text-align: left; flex: 1; min-height: 80px; }
    .filter-menu label { display: flex; gap: 8px; align-items: flex-start; padding: 5px 2px; font-weight: 800; font-size: 13px; cursor: pointer; }
    .filter-menu label input { margin-top: 2px; }

    .modal { position: fixed; inset: 0; background: rgba(59,42,85,0.4); display: none; place-items: center; z-index: 20; padding: 16px; }
    .modal.show { display: grid; }
    .modal-card { width: min(360px, 100%); background: #fff; border-radius: 24px; padding: 18px; text-align: center; color: var(--ink); }
    .modal-card input {
      width: 100%; border: 3px solid #ffe1ec; border-radius: 14px;
      padding: 10px; font-size: 20px; font-weight: 800; text-align: center; margin: 10px 0;
    }
    canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

    @media (max-height: 720px) {
      .mascot { width: 56px; height: 56px; font-size: 26px; }
      .teacher-btn, .login-acts .teacher-btn { width: 52px; height: 52px; min-width: 52px; flex-basis: 52px; font-size: 12px; }
      .choice-row .candy { padding: 10px 6px; font-size: 16px; }
      .hintbar { font-size: 17px; padding: 6px 10px; }
    }
    @media print {
      html, body, .app, .screen.active { position: static; height: auto; overflow: visible; }
      .no-print, canvas, .report, .modal, .filter-menu, .filter-btn { display: none !important; }
      .records { overflow: visible; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <div class="fun-bg" aria-hidden="true">
    <div class="deco deco-lt">
      <svg viewBox="0 0 24 14" preserveAspectRatio="xMidYMid meet" focusable="false"><polygon points="1,2 18,2 23,12 6,12" fill="#7eecc8" fill-opacity="0.65"/></svg>
    </div>
    <div class="deco deco-lbl">
      <svg viewBox="0 0 24 14" preserveAspectRatio="xMidYMid meet" focusable="false"><polygon points="6,2 23,2 18,12 1,12" fill="#ff7eb6" fill-opacity="0.6"/></svg>
    </div>
    <div class="deco deco-lbr">
      <svg viewBox="0 0 24 14" preserveAspectRatio="xMidYMid meet" focusable="false"><polygon points="2,3 16,1 21,11 7,13" fill="#ffe066" fill-opacity="0.65"/></svg>
    </div>
    <div class="deco deco-rt">
      <svg viewBox="0 0 24 14" preserveAspectRatio="xMidYMid meet" focusable="false"><polygon points="1,3 17,3 22,12 6,12" fill="#c9b6ff" fill-opacity="0.65"/></svg>
    </div>
    <div class="deco deco-rbl">
      <svg viewBox="0 0 24 14" preserveAspectRatio="xMidYMid meet" focusable="false"><polygon points="5,1 21,3 17,13 1,11" fill="#7eecc8" fill-opacity="0.6"/></svg>
    </div>
    <div class="deco deco-rbr">
      <svg viewBox="0 0 24 14" preserveAspectRatio="xMidYMid meet" focusable="false"><polygon points="2,2 18,4 22,13 6,11" fill="#ff7eb6" fill-opacity="0.65"/></svg>
    </div>
  </div>
  <canvas id="confetti"></canvas>
  <div class="app">
    <section id="screen-login" class="screen active">
      <div class="card login">
        <div class="mascot">🪄</div>
        <h1 class="title" id="titleWave"></h1>
        <div class="field">
          <label for="classId">班別</label>
          <input id="classId" maxlength="8" placeholder="5A" autocomplete="off" />
        </div>
        <div class="field">
          <label for="studentId">學號</label>
          <input id="studentId" maxlength="6" placeholder="01" inputmode="numeric" autocomplete="off" />
        </div>
        <button class="candy pink start" id="startBtn">開始任務</button>
        <div class="login-acts">
          <button class="candy mint teacher-btn" id="rankBtn">學生<br>排行</button>
          <button class="candy lilac teacher-btn" id="teacherBtn">老師<br>後台</button>
        </div>
      </div>
    </section>

    <section id="screen-game" class="screen">
      <div class="topbar">
        <div class="pill" id="playerPill">5A 01</div>
        <div class="pill" id="qPill">第 1 題</div>
        <div class="timer-wrap">
          <div class="pill timer" id="timer">⏱️ 03:00</div>
          <span class="time-hit" id="timeHit" aria-hidden="true">−5秒</span>
        </div>
        <button class="candy ghost tiny no-print" id="backLoginBtn">主頁</button>
      </div>
      <div class="card play">
        <div class="task-h">
          <h2 id="taskTitle">任務一：剪剪拼拼</h2>
          <p id="taskKind">平行四邊形</p>
        </div>
        <div class="hintbar" id="hintBar">1. 沿高剪下直角三角形　　2. 平移三角形，拼成長方形</div>
        <div class="board" id="board">
          <canvas id="scene"></canvas>
          <div class="idea" id="ideaBanner"></div>
        </div>
        <div class="toast" id="feedToast"></div>
        <div class="choice-row" id="phase1Acts">
          <button class="candy lemon" id="btnCut">✂️ 沿高剪下</button>
          <button class="candy lilac" id="btnWand" disabled>🪄 平移拼接</button>
        </div>
        <div class="opt-col" id="phase2Acts"></div>
      </div>
    </section>

    <section id="screen-dash" class="screen">
      <div class="dash-h">
        <h1>老師後台</h1>
        <div class="acts no-print">
          <button class="candy lemon tiny" id="printBtn">列印</button>
          <button class="candy sky tiny" id="refreshDashBtn">重新整理</button>

      let sheetLogsCache = null, dashSeq = 0, dashAllLogs = [], rankSeq = 0;

      function parseSheetStudent(s) {

      function jsonpSheet(url) {

          s.onerror = function () { cleanup(); reject(new Error("script")); };
          s.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + cb;
          document.body.appendChild(s);
        });
      }
      async function loadSheetLogs(force) {

        return sheetLogsCache;
      }
      function saveSession() {

        const d = diagnose();

      }

      function unlockAudio() {

      function tone(freq, dur, type, gain) {

        const g = audioCtx.createGain();

        o.connect(g); g.connect(audioCtx.destination);

      function renderTimer() {

      function rand(a, b) { return a + Math.random() * (b - a); }
      function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }
      function add(a, b) { return { x: a.x + b.x, y: a.y + b.y }; }
      function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y }; }
      function mul(a, s) { return { x: a.x * s, y: a.y * s }; }
      function dot(a, b) { return a.x * b.x + a.y * b.y; }
      function cross(a, b) { return a.x * b.y - a.y * b.x; }
      function len(a) { return Math.hypot(a.x, a.y); }
      function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
      function norm(a) { const L = len(a) || 1; return { x: a.x / L, y: a.y / L }; }
      function lerp(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }
      function rot(a, ang) {
        const c = Math.cos(ang), s = Math.sin(ang);
        return { x: a.x * c - a.y * s, y: a.x * s + a.y * c };
      }
      function centroid(pts) {
        let x = 0, y = 0;
        pts.forEach((p) => { x += p.x; y += p.y; });
        return { x: x / pts.length, y: y / pts.length };
      }
      function inTri(p, a, b, c) {
        const x = cross(sub(b, a), sub(p, a));
        const y = cross(sub(c, b), sub(p, b));
        const z = cross(sub(a, c), sub(p, c));
        return (x >= 0 && y >= 0 && z >= 0) || (x <= 0 && y <= 0 && z <= 0);
      }
      function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

      function setToast(ok, text) {
        const el = $("feedToast");
        el.className = "toast show " + (ok ? "good" : "bad");
        el.textContent = text;
      }
      function clearToast() { $("feedToast").className = "toast"; $("feedToast").textContent = ""; }

      function genLocal() {
        if (state.qIndex === 1) {
          return { base: 8, h: 5, sk: 3, slant: 6, unit: "cm", area: 40 };
        }
        for (let n = 0; n < 90; n++) {
          const base = rint(6, 12);
          const h = rint(4, 9);
          if (h === base) continue;
          const skAbs = rint(2, Math.max(2, Math.min(5, base - 3)));
          const sk = (Math.random() < 0.5 ? 1 : -1) * skAbs;
          const slant = Math.max(3, Math.round(Math.hypot(skAbs, h)));
          if (new Set([base, h, slant]).size < 3) continue;
          if (base * slant === base * h || h * slant === base * h) continue;
          const unit = Math.random() < 0.22 ? "m" : "cm";
          return { base, h, sk, slant, unit, area: base * h };
        }
        return { base: 8, h: 5, sk: 3, slant: 6, unit: "cm", area: 40 };
      }

      function localGeom(L) {
        const A = { x: 0, y: 0 }, B = { x: L.base, y: 0 };
        const C = { x: L.base + L.sk, y: L.h }, D = { x: L.sk, y: L.h };
        const leanRight = L.sk >= 0;
        const F = leanRight ? { x: L.sk, y: 0 } : { x: L.base + L.sk, y: 0 };
        const Gpt = leanRight ? { x: L.base + L.sk, y: 0 } : { x: L.sk, y: 0 };
        return {
          A, B, C, D, F, G: Gpt, leanRight,
          cutTri: leanRight ? [A, F, D] : [F, B, C],
          remain: leanRight ? [F, B, C, D] : [A, F, C, D],
          rect: leanRight ? [F, Gpt, C, D] : [Gpt, F, C, D],
          slideLocal: leanRight ? { x: L.base, y: 0 } : { x: -L.base, y: 0 },
          heightTop: leanRight ? D : C,
          heightBot: F
        };
      }
      function bboxFlip(pts) {
        let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
        pts.forEach((p) => {
          const x = p.x, y = -p.y;
          minx = Math.min(minx, x); miny = Math.min(miny, y);
          maxx = Math.max(maxx, x); maxy = Math.max(maxy, y);
        });
        return { minx, miny, maxx, maxy, bw: Math.max(1, maxx - minx), bh: Math.max(1, maxy - miny) };
      }
      function makeXf(box, b, scale) {
        const ox = box.x + box.w / 2 - (b.minx + b.maxx) / 2 * scale;
        const oy = box.y + box.h / 2 - (b.miny + b.maxy) / 2 * scale;
        const xf = (p) => ({ x: ox + p.x * scale, y: oy - p.y * scale });
        const xfV = (v) => ({ x: v.x * scale, y: -v.y * scale });
        return { xf, xfV };
      }
      function applyMapped(q, g, xf, xfV) {
        q.A = xf(g.A); q.B = xf(g.B); q.C = xf(g.C); q.D = xf(g.D);
        q.F = xf(g.F); q.G = xf(g.G);
        q.verts = [q.A, q.B, q.C, q.D];
        q.cutTri = g.cutTri.map(xf);
        q.remain = g.remain.map(xf);
        q.rect = g.rect.map(xf);
        q.heightTop = xf(g.heightTop);
        q.heightBot = xf(g.heightBot);
        q.slideVec = xfV(g.slideLocal);
        q.sepDir = norm(g.leanRight ? mul(xfV({ x: 1, y: 0 }), -1) : xfV({ x: 1, y: 0 }));
        q.leanRight = g.leanRight;
      }
      function pillHalf(text) {
        const n = [...String(text)].length;
        return { hw: Math.max(24, 12 + n * 9), hh: 18 };
      }
      function edgeOut(a, b, shapePts) {
        const mid = lerp(a, b, 0.5);
        const n = norm({ x: b.y - a.y, y: a.x - b.x });
        const c = centroid(shapePts);
        return dot(n, sub(c, mid)) > 0 ? mul(n, -1) : n;
      }
      function posOnEdge(a, b, t, shapePts, dist) {
        return add(lerp(a, b, t), mul(edgeOut(a, b, shapePts), dist));
      }
      function resolvePills(items, box) {
        if (!items || !items.length) return;
        const cap = 32, gap = 10;
        const bx = box || { x: 0, y: 0, w: state.cssW || 400, h: state.cssH || 400 };
        function clampItem(it) {
          const { hw, hh } = pillHalf(it.text);
          it.pos.x = Math.max(bx.x + hw + 4, Math.min(bx.x + bx.w - hw - 4, it.pos.x));
          it.pos.y = Math.max(bx.y + cap + hh, Math.min(bx.y + bx.h - hh - 6, it.pos.y));
        }
        items.forEach(clampItem);
        for (let k = 0; k < 18; k++) {
          let hit = false;
          for (let i = 0; i < items.length; i++) {
            for (let j = i + 1; j < items.length; j++) {
              const a = items[i], b = items[j];
              const ha = pillHalf(a.text), hb = pillHalf(b.text);
              const needX = ha.hw + hb.hw + gap;
              const needY = ha.hh + hb.hh + gap;
              const dx = b.pos.x - a.pos.x, dy = b.pos.y - a.pos.y;
              if (Math.abs(dx) >= needX || Math.abs(dy) >= needY) continue;
              hit = true;
              if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) {
                b.pos.y += 22;
                continue;
              }
              if (needX - Math.abs(dx) <= needY - Math.abs(dy)) {
                const s = ((dx < 0 ? -1 : 1) * (needX - Math.abs(dx))) / 2;
                a.pos.x -= s; b.pos.x += s;
              } else {
                const s = ((dy < 0 ? -1 : 1) * (needY - Math.abs(dy))) / 2;
                a.pos.y -= s; b.pos.y += s;
              }
            }
          }
          items.forEach(clampItem);
          if (!hit) break;
        }
      }
      function placeLabels(q, W, H) {
        const verts = q.verts;
        const baseMid = lerp(q.A, q.B, 0.5);
        const hMid = lerp(q.heightBot, q.heightTop, 0.55);
        const toIn = norm(sub(centroid(verts), hMid));
        const aD = lerp(q.A, q.D, 0.5), bC = lerp(q.B, q.C, 0.5);
        const useAD = dist(aD, hMid) >= dist(bC, hMid);
        const sA = useAD ? q.A : q.B, sB = useAD ? q.D : q.C;

      function layoutCanvas() {

      }

      function drawUnitGrid(ctx, origin, scale, box) {
        if (!origin || !scale || scale < 4 || !box) return;

        ctx.beginPath();
        ctx.rect(box.x, box.y, box.w, box.h);
        ctx.clip();

        for (let x = startX; x <= box.x + box.w + 0.5; x += s) {
          ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, box.y); ctx.lineTo(Math.round(x) + 0.5, box.y + box.h); ctx.stroke();

      }
      function drawGrid(ctx, w, h, q) {

            drawUnitGrid(ctx, q.rightOrigin, q.pxPerUnit, q.rightBox);
            return;

        ctx.strokeStyle = "#3b2a55"; ctx.lineWidth = 2.4;

      function pill(ctx, text, x, y, color, gone) {

        ctx.moveTo(rx + r, ry); ctx.arcTo(rx + w, ry, rx + w, ry + h, r);

      function drawScissors(ctx, q) {

      function flashAmt() {

      function showPhase(n) {

      function discStep() {

          const t = Math.min(1, (now - t0) / dur);

      function goPhase2() {

      function hitLabel(p, list) {

      function pickDiscover(ok, err, btn) {

      function pickArea(ok, err, btn) {
        if (state.ended || state.busy || !state.q || state.q.phase !== 2 || !state.q.slantGone) return;
        if (ok) {

          state.qTimes.push(Math.max(1, Math.round(used)));
          state.done += 1;
          sfx("ok");
          setToast(true, `答對。面積＝${state.q.area} ${state.q.unit}²`);
          bounce(btn);
          spawnSparks(centroid(state.q.verts), 12);
          setTimeout(() => {
            if (state.ended) return;
            state.qIndex += 1;
            newQuestion();
          }, 700);
        } else {
          if (err === "unit") state.missUnit += 1;
          else if (err === "slant") state.missSlant += 1;
          else state.missFormula += 1;
          sfx("bad");
          applyPenalty();
          bounce(btn);
          btn.classList.add("shake");
          setTimeout(() => btn.classList.remove("shake"), 400);
          setToast(false, err === "unit"

      function newQuestion() {

      function cssPos(e) {
        const src = e.touches && e.touches[0] ? e.touches[0] : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
        const r = scene.getBoundingClientRect();
        const w = r.width || 1, h = r.height || 1;
        return {

      function onUp(e) {

      function startGame() {

      function escapeHtml(s) {
        return String(s).replace(/[&<>"'`]/g, (c) => ({

      function cmpStudent(a, b) {

        const na = parseInt(a.studentId, 10), nb = parseInt(b.studentId, 10);
        if (!Number.isNaN(na) && !Number.isNaN(nb) && na !== nb) return na - nb;
        return String(a.studentId).localeCompare(String(b.studentId), "zh-Hant", { numeric: true });
      }
      function timeDay(t) {
        const s = String(t || "");
        const m = s.match(/^\d{4}\/\d{2}\/\d{2}/);
        return m ? m[0] : (s || "（空白）");
      }
      function colValue(key, e) {
        if (key === "student") return `${e.classId} ${e.studentId}`.trim() || "（空白）";
        if (key === "score") return String(e.done);
        if (key === "avg") return e.avgSec ? String(e.avgSec) : "—";
        if (key === "diagnosis") return e.diagnosis || "（空白）";

      }
      function classLogs() {

        return dashAllLogs.filter((e) => e.classId === dashClass);
      }
      function uniqueValues(key) {
        const set = new Set();
        classLogs().forEach((e) => set.add(colValue(key, e)));
        const arr = [...set];
        const spec = DASH_COLS.find((c) => c.key === key);
        arr.sort((a, b) => {
          if (spec && spec.numeric) {
            const na = Number(a), nb = Number(b);
            const fa = Number.isFinite(na), fb = Number.isFinite(nb);
            if (fa && fb) return na - nb;
            if (fa) return -1;
            if (fb) return 1;
          }
          return String(a).localeCompare(String(b), "zh-Hant", { numeric: true });
        });
        return arr;
      }
      function filterActive(key) {

      function anyFilterOn() { return DASH_COLS.some((c) => filterActive(c.key)); }
      function passesFilters(e) {

          else if (col === "avg") c = (a.avgSec || 0) - (b.avgSec || 0);
          else if (col === "student") c = cmpStudent(a, b);
          else if (col === "time") c = String(a.time || "").localeCompare(String(b.time || ""));
          else if (col === "diagnosis") c = String(a.diagnosis || "").localeCompare(String(b.diagnosis || ""), "zh-Hant");
          return (c * m) || cmpStudent(a, b);
        });
      }
      function sortMark(key) {
        if (dashSort.col !== key) return "";
        return dashSort.dir === "asc" ? " ▲" : " ▼";
      }
      function closeFilterMenu() {
        dashMenuCol = "";
        const menu = $("dashFilterMenu");
        if (menu) menu.classList.remove("show");
      }
      function resetDashFilters() {
        dashFilters = {};
        dashSort = { col: "student", dir: "asc" };
        dashClass = "ALL";
        closeFilterMenu();
      }
      function placeFilterMenu(anchor) {
        const menu = $("dashFilterMenu");
        const r = anchor.getBoundingClientRect();
        menu.classList.add("show");
        const w = menu.offsetWidth || 260;
        const h = menu.offsetHeight || 280;
        let left = Math.min(r.left, window.innerWidth - w - 8);
        let top = r.bottom + 4;

        menu.style.left = left + "px";
        menu.style.top = top + "px";
      }
      function renderFilterMenu(key, q) {
        const spec = DASH_COLS.find((c) => c.key === key);
        if (!spec) return;
        const values = uniqueValues(key);
        const sel = dashFilters[key];
        const query = String(q || "").trim();
        const shown = query ? values.filter((v) => String(v).indexOf(query) !== -1) : values;
        const allOn = !sel;
        const sortDesc = key === "time" ? "新 → 舊" : (spec.numeric ? "由高到低" : "由 Z 到 A");
        const sortAsc = key === "time" ? "舊 → 新" : (spec.numeric ? "由低到高" : "由 A 到 Z");
        $("dashFilterMenu").innerHTML = `
          <div class="fm-title">篩選：${escapeHtml(spec.label)}</div>

          <div class="opts">
            ${shown.map((v) => {

            }).join("") || `<div class="empty">沒有項目</div>`}
          </div>

        const search = $("fmSearch");

      function openFilterMenu(key, anchor) {

      function setColFilter(key, nextSet) {
        const all = uniqueValues(key);
        if (!nextSet || nextSet.size === all.length) dashFilters[key] = null;
        else dashFilters[key] = nextSet;
        paintDash();
        if (dashMenuCol === key) {
          const q = ($("fmSearch") && $("fmSearch").value) || "";
          renderFilterMenu(key, q);

          if (btn) placeFilterMenu(btn);

      }
      function paintDash() {
        DASH_COLS.forEach((col) => {
          const sel = dashFilters[col.key];
          if (!sel) return;
          const all = new Set(uniqueValues(col.key));
          const next = new Set([...sel].filter((v) => all.has(v)));
          dashFilters[col.key] = next.size === all.size ? null : next;
        });
        const sourceEl = $("dashSource");
        const base = classLogs();
        const logs = base.filter(passesFilters);
        const avgDone = logs.length ? Math.round((logs.reduce((n, e) => n + (e.done || 0), 0) / logs.length) * 10) / 10 : 0;
        const slantTotal = logs.reduce((n, e) => n + (e.slantErr || 0), 0);
        const unitTotal = logs.reduce((n, e) => n + (e.unitErr || 0), 0);
        const classes = [...new Set(dashAllLogs.map((s) => s.classId).filter(Boolean))].sort();
        $("classFilter").innerHTML = `<option value="ALL">全部班別</option>` +
          classes.map((c) => `<option value="${escapeHtml(c)}" ${c === dashClass ? "selected" : ""}>${escapeHtml(c)}</option>`).join("");
        $("analysisCards").innerHTML = `
          <div class="stat s1"><b>平均 3 分鐘完成題數</b><strong>${logs.length ? avgDone : "—"}</strong></div>
          <div class="stat s2"><b>誤用斜邊</b><strong>${slantTotal}</strong></div>
          <div class="stat s3"><b>單位／公式混淆</b><strong>${unitTotal}</strong></div>
        `;
        if ($("dashCount")) $("dashCount").textContent = dashAllLogs.length ? `顯示 ${logs.length} / ${base.length} 筆` : "";
        if ($("clearFiltersBtn")) $("clearFiltersBtn").style.visibility = anyFilterOn() ? "visible" : "hidden";
        if (!dashAllLogs.length) {
          $("studentRecords").innerHTML = `<div class="empty">${sourceEl && sourceEl.textContent.indexOf("未能") >= 0 ? "未能連線 Google 試算表" : "未有紀錄"}</div>`;
          return;
        }
        const ranked = sortLogs(logs);
        const scores = ranked.map((e) => e.done || 0).slice().sort((a, b) => a - b);
        const hiCut = scores.length ? scores[Math.max(0, scores.length - Math.ceil(scores.length * 0.2))] || 0 : 0;
        const loCut = scores.length ? scores[Math.min(scores.length - 1, Math.floor(scores.length * 0.2))] || 0 : 0;
        const showRank = dashSort.col === "score";
        const head = (key, extra) => {

          const on = filterActive(key);
          const sorted = dashSort.col === key ? " sorted" : "";
          return `<th class="col-h${extra || ""}${sorted}" data-col="${key}">

          </th>`;
        };
        const body = ranked.length ? ranked.map((e, i) => {

          const hi = e.done >= hiCut && e.done > 0;

          return `<tr class="${hi ? "hi" : lo ? "lo" : ""}">
            ${showRank ? `<td class="rank-cell">${rank}</td>` : ""}

        }).join("") : `<tr><td colspan="${showRank ? 6 : 5}" class="empty">此篩選沒有紀錄，可按 ▼ 更改</td></tr>`;
        $("studentRecords").innerHTML = `<table>
          <thead><tr>
            ${showRank ? `<th class="score-h">名次</th>` : ""}
            ${head("student")}
            ${head("score", " score-h")}
            ${head("avg")}
            ${head("diagnosis")}
            ${head("time")}
          </tr></thead>
          <tbody>${body}</tbody>
        </table>`;
      }
      function bestPerStudent(logs) {
        const map = new Map();
        (logs || []).forEach((e) => {
          if (!e.studentId && !e.classId) return;
          const key = studentKey(e.classId, e.studentId);
          const prev = map.get(key);
          const better = !prev
            || (e.done || 0) > (prev.done || 0)
            || ((e.done || 0) === (prev.done || 0) && (e.avgSec || 99999) < (prev.avgSec || 99999));
          if (better) map.set(key, e);
        });
        return [...map.values()]
          .filter((e) => (e.done || 0) > 0)
          .sort((a, b) => {
            if ((b.done || 0) !== (a.done || 0)) return (b.done || 0) - (a.done || 0);
            const ta = a.avgSec || 99999, tb = b.avgSec || 99999;
            if (ta !== tb) return ta - tb;
            return cmpStudent(a, b);
          })
          .slice(0, 10);
      }
      async function renderRank(force) {
        const seq = ++rankSeq;
        const box = $("rankRecords");
        if (!box) return;
        box.innerHTML = `<div class="empty">載入排行榜…</div>`;
        let logs = [];
        let fail = false;
        try { logs = await loadSheetLogs(!!force); }
        catch (err) { fail = true; }
        if (seq !== rankSeq) return;
        if (fail) {
          box.innerHTML = `<div class="empty">未能連線 Google 試算表</div>`;
          return;
        }
        const top = bestPerStudent(logs);
        if (!top.length) {
          box.innerHTML = `<div class="empty">未有紀錄</div>`;
          return;
        }
        box.innerHTML = `<table>
          <thead><tr>
            <th class="score-h">名次</th>
            <th>班別學號</th>
            <th class="score-h">答對題數</th>
          </tr></thead>
          <tbody>${top.map((e, i) => {
            const n = i + 1;
            const cls = n === 1 ? "r1" : n === 2 ? "r2" : n === 3 ? "r3" : "";
            return `<tr class="${cls}">
              <td class="rank-cell">${n}</td>
              <td>${escapeHtml(e.classId)} ${escapeHtml(e.studentId)}</td>
              <td class="score-cell">${e.done || 0}</td>
            </tr>`;
          }).join("")}</tbody>
        </table>`;
      }
      async function renderDashboard(filterClass, force) {
        const seq = ++dashSeq;
        if (filterClass) dashClass = filterClass;
        $("studentRecords").innerHTML = `<div class="empty">載入全班分數…</div>`;
        $("analysisCards").innerHTML = `
          <div class="stat s1"><b>平均 3 分鐘完成題數</b><strong>…</strong></div>
          <div class="stat s2"><b>誤用斜邊</b><strong>…</strong></div>
          <div class="stat s3"><b>單位／公式混淆</b><strong>…</strong></div>
        `;
        let source = "";
        try { dashAllLogs = await loadSheetLogs(!!force); source = "Google 試算表"; }
        catch (err) { dashAllLogs = loadStore().logs; source = sheetConfigured() ? "本機（未能連線試算表）" : "本機"; }
        if (seq !== dashSeq) return;
        if ($("dashSource")) $("dashSource").textContent = source;
        paintDash();
      }

      const confetti = $("confetti");
      const cfx = confetti.getContext("2d");
      let pieces = [];
      function resizeConfetti() { confetti.width = window.innerWidth; confetti.height = window.innerHeight; }
      function burstConfetti(count) {
        const colors = ["#ff7eb6", "#5cc8ff", "#ffe066", "#c9b6ff", "#7eecc8"];
        for (let i = 0; i < count; i++) {
          pieces.push({
            x: confetti.width * (0.2 + Math.random() * 0.6), y: -12,
            r: 4 + Math.random() * 6, c: colors[i % colors.length],
            vx: -3 + Math.random() * 6, vy: 3 + Math.random() * 5,
            rot: Math.random() * 360, vr: -8 + Math.random() * 16,
            life: 80 + Math.random() * 40, shape: i % 3
          });
        }
      }
      (function tick() {
        cfx.clearRect(0, 0, confetti.width, confetti.height);
        pieces = pieces.filter((p) => p.life > 0);
        pieces.forEach((p) => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.rot += p.vr; p.life -= 1;
          cfx.save(); cfx.translate(p.x, p.y); cfx.rotate(p.rot * Math.PI / 180);
          cfx.globalAlpha = Math.max(0, p.life / 70); cfx.fillStyle = p.c;
          if (p.shape === 0) cfx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
          else if (p.shape === 1) { cfx.beginPath(); cfx.arc(0, 0, p.r, 0, Math.PI * 2); cfx.fill(); }
          else { cfx.beginPath(); cfx.moveTo(0, -p.r); cfx.lineTo(p.r, p.r); cfx.lineTo(-p.r, p.r); cfx.closePath(); cfx.fill(); }
          cfx.restore();
        });
        if (screens.game.classList.contains("active") && (state.sparks.length || (state.q && state.q.discover))) draw();
        sparkLoop = requestAnimationFrame(tick);
      })();
      resizeConfetti();
      window.addEventListener("resize", () => {
        resizeConfetti();
        if (screens.game.classList.contains("active")) { layoutCanvas(); draw(); }
      });
      document.addEventListener("touchmove", (e) => {
        if (e.target.closest(".records, .filter-menu, input")) return;
        e.preventDefault();
      }, { passive: false });

      bindCanvas();
      if (window.ResizeObserver && $("board")) {
        new ResizeObserver(() => {
          if (!screens.game.classList.contains("active") || !state.q) return;
          layoutCanvas();
          draw();
        }).observe($("board"));
      }

      $("startBtn").addEventListener("click", startGame);
      $("classId").addEventListener("keydown", (e) => { if (e.key === "Enter") $("studentId").focus(); });
      $("studentId").addEventListener("keydown", (e) => { if (e.key === "Enter") startGame(); });
      $("rankBtn").addEventListener("click", () => {
        showScreen("rank");
        renderRank(true);
      });
      $("rankBackBtn").addEventListener("click", () => showScreen("login"));
      $("rankRefreshBtn").addEventListener("click", () => renderRank(true));
      $("teacherBtn").addEventListener("click", () => {
        $("pinModal").classList.add("show");
        $("pinInput").value = "";
        $("pinInput").focus();
      });
      $("pinCancel").addEventListener("click", () => $("pinModal").classList.remove("show"));
      $("pinOk").addEventListener("click", () => {
        if ($("pinInput").value === TEACHER_PIN) {
          $("pinModal").classList.remove("show");
          resetDashFilters();
          showScreen("dash");
          renderDashboard("ALL", true);
        } else {
          bounce($("pinInput"));
          $("pinInput").classList.add("shake");
          setTimeout(() => $("pinInput").classList.remove("shake"), 400);
          $("pinInput").value = "";
        }
      });
      $("pinInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("pinOk").click(); });
      $("dashBackBtn").addEventListener("click", () => { closeFilterMenu(); showScreen("login"); });
      $("backLoginBtn").addEventListener("click", () => {
        if (!state.ended && (state.done > 0 || state.missSlant + state.missUnit + state.missFormula > 0)) {
          endSession();
          return;
        }
        $("studentId").value = "";
        $("reportModal").classList.remove("show");
        showScreen("login");
        $("studentId").focus();
      });
      $("reportBackBtn").addEventListener("click", () => {
        $("reportModal").classList.remove("show");
        $("studentId").value = "";
        showScreen("login");
        $("studentId").focus();
      });
      $("printBtn").addEventListener("click", () => window.print());
      $("classFilter").addEventListener("change", (e) => {
        dashClass = e.target.value || "ALL";
        closeFilterMenu();
        paintDash();
      });
      $("clearFiltersBtn").addEventListener("click", () => {
        dashFilters = {};
        closeFilterMenu();
        paintDash();
      });
      $("studentRecords").addEventListener("click", (e) => {
        const fb = e.target.closest(".filter-btn");
        if (fb) {
          e.stopPropagation();
          const key = fb.getAttribute("data-filter");
          if (dashMenuCol === key && $("dashFilterMenu").classList.contains("show")) closeFilterMenu();
          else openFilterMenu(key, fb);
          return;
        }
        const sb = e.target.closest(".col-sort");
        if (!sb) return;
        const key = sb.getAttribute("data-sort");
        if (dashSort.col === key) dashSort.dir = dashSort.dir === "desc" ? "asc" : "desc";
        else dashSort = { col: key, dir: (key === "student" || key === "diagnosis") ? "asc" : "desc" };
        paintDash();
      });
      $("dashFilterMenu").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-fm]");
        if (!btn || !dashMenuCol) return;
        const act = btn.getAttribute("data-fm");
        const key = dashMenuCol;
        if (act === "sort-desc") { dashSort = { col: key, dir: "desc" }; paintDash(); }
        else if (act === "sort-asc") { dashSort = { col: key, dir: "asc" }; paintDash(); }
        else if (act === "all" || act === "clear") setColFilter(key, null);
        else if (act === "none") setColFilter(key, new Set());
        if (act === "sort-desc" || act === "sort-asc") {
          const anchor = document.querySelector(`.filter-btn[data-filter="${key}"]`);
          if (anchor) placeFilterMenu(anchor);
        }
      });
      $("dashFilterMenu").addEventListener("change", (e) => {
        const inp = e.target;
        if (!inp.matches || !inp.matches("input[type='checkbox'][data-idx]")) return;
        const key = dashMenuCol;
        const values = uniqueValues(key);
        const val = values[Number(inp.getAttribute("data-idx"))];
        if (val == null) return;
        const sel = dashFilters[key] ? new Set(dashFilters[key]) : new Set(values);
        if (inp.checked) sel.add(val); else sel.delete(val);
        setColFilter(key, sel);
      });
      $("dashFilterMenu").addEventListener("input", (e) => {
        if (e.target.id !== "fmSearch" || !dashMenuCol) return;
        renderFilterMenu(dashMenuCol, e.target.value);
        const btn = document.querySelector(`.filter-btn[data-filter="${dashMenuCol}"]`);
        if (btn) placeFilterMenu(btn);
      });
      document.addEventListener("click", (e) => {
        const menu = $("dashFilterMenu");
        if (!menu || !menu.classList.contains("show")) return;
        if (menu.contains(e.target) || e.target.closest(".filter-btn")) return;
        closeFilterMenu();
      });
      $("refreshDashBtn").addEventListener("click", () => renderDashboard($("classFilter").value || "ALL", true));
      $("btnCut").addEventListener("click", animateCut);
      $("btnWand").addEventListener("click", () => animateSlide(state.q && state.q.triOffset));
      $("phase2Acts").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-ok]");
        if (!btn) return;
        if (state.q && state.q.discover) {
          pickDiscover(btn.getAttribute("data-ok") === "1", btn.getAttribute("data-err"), btn);
        } else {
          pickArea(btn.getAttribute("data-ok") === "1", btn.getAttribute("data-err"), btn);
        }
      });
    })();
  </script>
</body>
</html>
